name: Cargar sucursales (una vez / manual)

# Carga inicial de la tabla `sucursales` de Precios Claros para Zona
# Norte/GBA. NO corre por cron a propósito -- solo hace falta correrlo una
# vez (o cada tanto si se quiere ampliar/actualizar el radio cubierto), a
# diferencia de "Scrape diario ofertas" que sí corre todos los días.
# fetch_precios.py depende de que esta tabla ya tenga datos.

on:
  workflow_dispatch: {}

jobs:
  fetch_sucursales:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scrapers/requirements.txt

      - name: Cargar sucursales
        run: .venv/bin/python scrapers/precios_claros/fetch_sucursales.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
