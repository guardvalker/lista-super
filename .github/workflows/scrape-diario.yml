name: Scrape precios de referencia

on:
  schedule:
    - cron: '0 9 1,15 * *'   # 9:00 UTC = 6:00 ARG, el 1 y el 15 de cada mes
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scrapers/requirements.txt

      - name: Precios (Precios Claros)
        run: .venv/bin/python scrapers/precios_claros/fetch_precios.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notificar si falló
        if: failure()
        run: echo "Revisar logs del run en GitHub Actions"
