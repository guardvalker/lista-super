<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lista del Super</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lista Super">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Aplicar el tema antes de pintar para evitar el flash de color equivocado.
  (function() {
    try {
      var t = localStorage.getItem('lista_super_theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    /* Catppuccin Mocha (tema oscuro, por defecto) */
    --ctp-rosewater: #f5e0dc;
    --ctp-flamingo: #f2cdcd;
    --ctp-pink: #f5c2e7;
    --ctp-mauve: #cba6f7;
    --ctp-red: #f38ba8;
    --ctp-maroon: #eba0ac;
    --ctp-peach: #fab387;
    --ctp-yellow: #f9e2af;
    --ctp-green: #a6e3a1;
    --ctp-teal: #94e2d5;
    --ctp-sky: #89dceb;
    --ctp-sapphire: #74c7ec;
    --ctp-blue: #89b4fa;
    --ctp-lavender: #b4befe;

    --bg: #1e1e2e;
    --bg-solid: #1e1e2e;
    --card: #313244;
    --card-2: #45475a;
    --border: #45475a;
    --text: #cdd6f4;
    --text-dim: #a6adc8;
    --accent: var(--ctp-green);
    --accent-2: var(--ctp-teal);
    --accent-dim: rgba(166,227,161,0.18);
    --danger: var(--ctp-red);
    --on-accent: #1e1e2e;
    --glow-1: rgba(203,166,247,0.20);
    --glow-2: rgba(137,180,250,0.16);
    --glow-3: rgba(148,226,213,0.14);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  :root[data-theme="light"] {
    /* Catppuccin Latte (tema claro) */
    --ctp-rosewater: #dc8a78;
    --ctp-flamingo: #dd7878;
    --ctp-pink: #ea76cb;
    --ctp-mauve: #8839ef;
    --ctp-red: #d20f39;
    --ctp-maroon: #e64553;
    --ctp-peach: #fe640b;
    --ctp-yellow: #df8e1d;
    --ctp-green: #40a02b;
    --ctp-teal: #179299;
    --ctp-sky: #04a5e5;
    --ctp-sapphire: #209fb5;
    --ctp-blue: #1e66f5;
    --ctp-lavender: #7287fd;

    --bg: #eff1f5;
    --bg-solid: #eff1f5;
    --card: #ffffff;
    --card-2: #e6e9ef;
    --border: #ccd0da;
    --text: #4c4f69;
    --text-dim: #6c6f85;
    --accent: var(--ctp-green);
    --accent-2: var(--ctp-teal);
    --accent-dim: rgba(64,160,43,0.14);
    --danger: var(--ctp-red);
    --on-accent: #ffffff;
    --glow-1: rgba(136,57,239,0.10);
    --glow-2: rgba(30,102,245,0.09);
    --glow-3: rgba(23,146,153,0.09);
    --shadow: 0 8px 24px rgba(76,79,105,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(166,227,161,0.2); }
  button, .checkbox, .item-text, .category-header, .toggle-btn, .clear-btn, .suggestion-item, .modal-cat-btn {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0; padding: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overscroll-behavior-y: contain;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  html {
    background: var(--bg-solid);
  }
  body {
    background:
      radial-gradient(circle at 12% 0%, var(--glow-1), transparent 42%),
      radial-gradient(circle at 88% 8%, var(--glow-2), transparent 46%),
      radial-gradient(circle at 50% 100%, var(--glow-3), transparent 55%),
      var(--bg-solid);
    background-attachment: fixed;
    min-height: 100%;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }
  header {
    padding: 20px 16px 12px 16px;
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--bg-solid) 82%, transparent 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 20;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-blue) 55%, var(--ctp-teal));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    width: fit-content;
  }
  .theme-toggle {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  .theme-toggle:active { transform: scale(0.92); }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    position: relative;
  }
  #newItem {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #newItem:focus {
    border-color: var(--ctp-mauve);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  #addBtn {
    background: linear-gradient(135deg, var(--ctp-green), var(--ctp-teal));
    color: var(--on-accent);
    border: none;
    border-radius: 12px;
    width: 52px;
    min-width: 52px;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }
  #addBtn:active { transform: scale(0.95); }

  /* Autocomplete dropdown */
  .suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 60px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 30;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:active, .suggestion-item.highlighted {
    background: var(--card);
  }
  .suggestion-cat {
    font-size: 11px;
    color: var(--cat-color, var(--text-dim));
    background: color-mix(in srgb, var(--cat-color, var(--border)) 16%, var(--bg));
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 6px 16px;
    color: var(--text-dim);
    font-size: 13px;
    gap: 8px;
  }
  .toggle-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .toggle-btn.active {
    color: var(--accent);
    border-color: transparent;
    background: var(--accent-dim);
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    padding: 8px;
    white-space: nowrap;
  }
  .clear-btn:active { opacity: 0.7; }

  main {
    flex: 1;
    padding: 4px 16px 24px 16px;
    overflow-y: auto;
  }

  .category-section {
    margin-bottom: 18px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px 8px 10px;
    border-left: 3px solid var(--cat-color, var(--border));
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
  }
  .category-icon {
    font-size: 15px;
    background: var(--cat-color, var(--card));
    background: color-mix(in srgb, var(--cat-color, var(--border)) 20%, transparent);
    border-radius: 8px;
    padding: 5px 7px;
    line-height: 1;
  }
  .category-name {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-dim);
    flex: 1;
  }
  .category-count {
    font-size: 12px;
    color: var(--cat-color, var(--text-dim));
    background: var(--card);
    background: color-mix(in srgb, var(--cat-color, var(--border)) 14%, var(--card));
    border: 1px solid color-mix(in srgb, var(--cat-color, var(--border)) 40%, transparent);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .category-chevron {
    color: var(--text-dim);
    font-size: 12px;
    transition: transform 0.15s ease;
  }
  .category-section.collapsed .category-chevron { transform: rotate(-90deg); }
  .category-section.collapsed ul { display: none; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--cat-color, var(--border));
    border-radius: 12px;
    padding: 14px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-height: 200px;
    overflow: hidden;
    transition: opacity 0.28s ease, transform 0.28s ease, max-height 0.32s ease,
      padding 0.32s ease, margin-bottom 0.32s ease, border-width 0.32s ease,
      background-color 0.2s ease;
  }
  li.checked {
    background: var(--card-2);
    opacity: 0.55;
  }
  li.removing {
    opacity: 0;
    transform: scale(0.94);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-bottom: 0;
    border-width: 0;
  }
  .checkbox {
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 7px;
    border: 2px solid var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    color: transparent;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  li.checked .checkbox {
    background: linear-gradient(135deg, var(--ctp-green), var(--ctp-teal));
    border-color: transparent;
    color: var(--on-accent);
    transform: scale(1.05);
  }
  .item-text {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
    cursor: pointer;
  }
  li.checked .item-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .edit-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
  }
  .edit-btn:active { color: var(--accent); }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
  }
  .delete-btn:active { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  .empty-emoji { font-size: 40px; margin-bottom: 12px; }

  footer {
    text-align: center;
    padding: 10px;
    color: var(--text-dim);
    font-size: 11px;
  }

  /* Category picker modal (for unrecognized items) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17,17,27,0.6);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 520px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .modal-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .modal-cat-btn {
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 10px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .modal-cat-btn:active { background: var(--border); }
  .whatsnew-list { margin: 0 0 16px 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; }
  .whatsnew-list li { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .modal-cat-btn.selected {
    border-color: var(--cat-color, var(--accent));
    background: color-mix(in srgb, var(--cat-color, var(--accent)) 18%, var(--card-2));
    color: var(--cat-color, var(--accent));
  }
  .modal-input {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .modal-input:focus {
    border-color: var(--ctp-mauve);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .modal-save-btn {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(135deg, var(--ctp-green), var(--ctp-teal));
    color: var(--on-accent);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .modal-save-btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <h1>🛒 Lista del Super</h1>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema"></button>
    </div>
    <div class="subtitle" id="counter">0 items</div>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Agregar item... (ej: leche, pollo)" autocomplete="off" autocorrect="off">
      <button id="addBtn">+</button>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </header>

  <div class="controls">
    <button class="toggle-btn active" id="toggleChecked">
      <span id="toggleIcon">👁️</span> <span id="toggleLabel">Ocultar tachados</span>
    </button>
    <button class="clear-btn" id="clearChecked">Borrar tachados</button>
  </div>

  <main id="main">
    <div class="empty" id="emptyState" style="display:none;">
      <div class="empty-emoji">🥕</div>
      Tu lista está vacía.<br>Agregá algo para empezar.
    </div>
  </main>

  <footer>Se guarda automáticamente en este dispositivo</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">¿En qué categoría va?</div>
    <div class="modal-subtitle">No reconocí este item, elegí la sección</div>
    <div class="modal-grid" id="modalGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="whatsnewOverlay">
  <div class="modal">
    <div class="modal-title">Se actualizó la app</div>
    <div class="modal-subtitle">versión <span id="whatsnewVersion"></span></div>
    <ul class="whatsnew-list" id="whatsnewList"></ul>
    <button class="modal-save-btn" id="whatsnewCloseBtn" type="button">Entendido</button>
  </div>
</div>

<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <div class="modal-title">Editar item</div>
    <input type="text" id="editItemInput" class="modal-input" autocomplete="off" autocorrect="off">
    <div class="modal-subtitle">Categoría</div>
    <div class="modal-grid" id="editModalGrid"></div>
    <button class="modal-save-btn" id="editSaveBtn" type="button">Guardar cambios</button>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'lista_super_items';
  const SHOW_CHECKED_KEY = 'lista_super_show_checked';
  const COLLAPSED_KEY = 'lista_super_collapsed';
  const THEME_KEY = 'lista_super_theme';

  // subir APP_VERSION y agregar una entrada acá en cada cambio que valga la pena avisar
  const APP_VERSION = '1.1.0';
  const CHANGELOG = {
    '1.1.0': [
      'Ahora te avisamos acá cuando la app tiene novedades, en vez de que te enteres por sorpresa.'
    ]
  };
  const SEEN_VERSION_KEY = 'lista_super_seen_version';

  // ---- Tema claro/oscuro ----
  let theme = document.documentElement.getAttribute('data-theme') || 'dark';

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1e1e2e' : '#eff1f5');
  }

  document.getElementById('themeToggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, theme);
    applyTheme();
  });

  // ---- Categorías ----
  // color: nombre de variable --ctp-<color> (paleta Catppuccin) para identidad visual
  const CATEGORIES = [
    { id: 'frutas_verduras', name: 'Frutas y Verduras', icon: '🥬', color: 'green' },
    { id: 'carnes',          name: 'Carnes y Fiambres',  icon: '🥩', color: 'red' },
    { id: 'pescados',        name: 'Pescados y Mariscos', icon: '🐟', color: 'sapphire' },
    { id: 'lacteos',         name: 'Lácteos y Huevos',   icon: '🥛', color: 'yellow' },
    { id: 'panaderia',       name: 'Panadería',          icon: '🍞', color: 'peach' },
    { id: 'almacen',         name: 'Almacén',            icon: '🥫', color: 'mauve' },
    { id: 'condimentos',     name: 'Condimentos y Salsas', icon: '🧂', color: 'maroon' },
    { id: 'bebidas',         name: 'Bebidas',            icon: '🥤', color: 'blue' },
    { id: 'congelados',      name: 'Congelados',         icon: '🧊', color: 'sky' },
    { id: 'snacks',          name: 'Snacks y Dulces',    icon: '🍪', color: 'pink' },
    { id: 'limpieza',        name: 'Limpieza',           icon: '🧽', color: 'teal' },
    { id: 'higiene',         name: 'Higiene y Perfumería', icon: '🧴', color: 'rosewater' },
    { id: 'bebes',           name: 'Bebés',              icon: '🍼', color: 'flamingo' },
    { id: 'mascotas',        name: 'Mascotas',           icon: '🐾', color: 'lavender' },
    { id: 'otros',           name: 'Otros',              icon: '🛍️', color: null },
  ];
  const catById = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

  function catColorVar(cat) {
    return cat && cat.color ? `var(--ctp-${cat.color})` : 'var(--text-dim)';
  }

  // ---- Diccionario producto -> categoría ----
  const PRODUCT_MAP = {
    // Frutas y verduras
    'manzana':'frutas_verduras','banana':'frutas_verduras','platano':'frutas_verduras','naranja':'frutas_verduras',

  function normalize(str) {
    return str.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quitar tildes
      .trim();
  }

  function detectCategory(rawText) {
    const text = normalize(rawText);
    // 1. match exacto
    if (PRODUCT_MAP[text]) return PRODUCT_MAP[text];
    // 2. el texto contiene alguna clave del diccionario (clave mas larga primero)
    const keys = Object.keys(PRODUCT_MAP).sort((a,b) => b.length - a.length);
    for (const key of keys) {
      if (text.includes(key)) return PRODUCT_MAP[key];
    }
    // 3. alguna palabra del texto es clave exacta
    const words = text.split(/\s+/);
    for (const w of words) {
      if (PRODUCT_MAP[w]) return PRODUCT_MAP[w];
    }
    return null; // no reconocido
  }

  // ---- Estado ----
  let items = [];
  let showChecked = true;
  let collapsed = {};
  let pendingText = null; // texto esperando que el usuario elija categoría
  let highlightedIndex = -1;
  let currentSuggestions = [];
  let editingId = null; // id del item que se está editando
  let editingCategory = null; // categoría elegida en el modal de edición

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch (e) { items = []; }
    const showRaw = localStorage.getItem(SHOW_CHECKED_KEY);
    showChecked = showRaw === null ? true : showRaw === 'true';
    try {
      const colRaw = localStorage.getItem(COLLAPSED_KEY);
      collapsed = colRaw ? JSON.parse(colRaw) : {};
    } catch(e) { collapsed = {}; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    localStorage.setItem(SHOW_CHECKED_KEY, String(showChecked));
    localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function render() {
    const main = document.getElementById('main');
    const emptyState = document.getElementById('emptyState');
    const counter = document.getElementById('counter');

    const visibleItems = showChecked ? items : items.filter(i => !i.checked);
    const totalCount = items.length;
    const checkedCount = items.filter(i => i.checked).length;

    counter.textContent = totalCount === 0
      ? '0 items'
      : `${totalCount} item${totalCount !== 1 ? 's' : ''} · ${checkedCount} tachado${checkedCount !== 1 ? 's' : ''}`;

    main.querySelectorAll('.category-section').forEach(el => el.remove());

    if (visibleItems.length === 0) {
      emptyState.style.display = 'block';
      emptyState.innerHTML = totalCount === 0
        ? '<div class="empty-emoji">🥕</div>Tu lista está vacía.<br>Agregá algo para empezar.'
        : '<div class="empty-emoji">✅</div>Todo tachado.<br>Tocá el ojito para verlos.';
      return;
    } else {
      emptyState.style.display = 'none';
    }

    const grouped = {};
    visibleItems.forEach(item => {
      const cat = item.category || 'otros';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(item);
    });

    CATEGORIES.forEach(cat => {
      const catItems = grouped[cat.id];
      if (!catItems || catItems.length === 0) return;

      const section = document.createElement('div');
      section.className = 'category-section' + (collapsed[cat.id] ? ' collapsed' : '');
      section.dataset.catId = cat.id;
      section.style.setProperty('--cat-color', catColorVar(cat));

      const header = document.createElement('div');
      header.className = 'category-header';
      header.dataset.action = 'toggle-collapse';
      header.dataset.catId = cat.id;
      header.innerHTML = `
        <span class="category-icon">${cat.icon}</span>
        <span class="category-name">${cat.name}</span>
        <span class="category-count">${catItems.length}</span>
        <span class="category-chevron">▼</span>
      `;

      const ul = document.createElement('ul');
      catItems.forEach(item => {
        const li = document.createElement('li');
        li.className = item.checked ? 'checked' : '';
        li.dataset.id = item.id;

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox';
        checkbox.textContent = '✓';
        checkbox.dataset.action = 'toggle-item';
        checkbox.dataset.id = item.id;

        const text = document.createElement('div');
        text.className = 'item-text';
        text.textContent = item.text;
        text.dataset.action = 'toggle-item';
        text.dataset.id = item.id;

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✏️';
        editBtn.type = 'button';
        editBtn.dataset.action = 'edit-item';
        editBtn.dataset.id = item.id;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.type = 'button';
        delBtn.dataset.action = 'delete-item';
        delBtn.dataset.id = item.id;

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(editBtn);
        li.appendChild(delBtn);
        ul.appendChild(li);
      });

      section.appendChild(header);
      section.appendChild(ul);
      main.appendChild(section);
    });

    const toggleBtn = document.getElementById('toggleChecked');
    const toggleLabel = document.getElementById('toggleLabel');
    toggleBtn.className = 'toggle-btn' + (showChecked ? ' active' : '');
    toggleLabel.textContent = showChecked ? 'Ocultar tachados' : 'Mostrar tachados';
  }

  function addItemWithCategory(text, category) {
    const trimmed = text.trim();
    if (!trimmed) return;
    items.unshift({ id: uid(), text: trimmed, checked: false, category });
    save();
    render();
  }

  function addItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const category = detectCategory(trimmed);
    if (category) {
      addItemWithCategory(trimmed, category);
    } else {
      openCategoryModal(trimmed);
    }
  }

  const REMOVE_ANIM_MS = 320;

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    item.checked = !item.checked;
    save();

    // Si al tacharlo va a desaparecer de la vista (porque "ocultar tachados"
    // está activo), dejamos que la animación de salida se vea antes de
    // reconstruir la lista, en vez de que el item desaparezca de golpe.
    const willHide = item.checked && !showChecked;
    if (willHide) {
      const li = document.querySelector(`li[data-id="${CSS.escape(id)}"]`);
      if (li) {
        li.classList.add('checked');
        requestAnimationFrame(() => li.classList.add('removing'));
        setTimeout(render, REMOVE_ANIM_MS);
        return;
      }
    }
    render();
  }

  function deleteItem(id) {
    const li = document.querySelector(`li[data-id="${CSS.escape(id)}"]`);
    if (li) {
      li.classList.add('removing');
      setTimeout(() => {
        items = items.filter(i => i.id !== id);
        save();
        render();
      }, REMOVE_ANIM_MS);
      return;
    }
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function clearChecked() {
    const checkedCount = items.filter(i => i.checked).length;
    if (checkedCount === 0) return;
    if (confirm(`¿Borrar ${checkedCount} item${checkedCount !== 1 ? 's' : ''} tachado${checkedCount !== 1 ? 's' : ''}?`)) {
      items = items.filter(i => !i.checked);
      save();
      render();
    }
  }

  // ---- Modal para elegir categoría manual ----
  function openCategoryModal(text) {
    pendingText = text;
    document.getElementById('modalTitle').textContent = `"${text}" — ¿en qué categoría va?`;
    const grid = document.getElementById('modalGrid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'modal-cat-btn';
      btn.type = 'button';
      btn.dataset.action = 'pick-category';
      btn.dataset.catId = cat.id;
      btn.style.setProperty('--cat-color', catColorVar(cat));
      btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;
      grid.appendChild(btn);
    });
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    pendingText = null;
  }

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  // ---- Novedades de la app ----
  function closeWhatsnew() {
    document.getElementById('whatsnewOverlay').classList.remove('show');
  }
  document.getElementById('whatsnewCloseBtn').addEventListener('click', closeWhatsnew);
  document.getElementById('whatsnewOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'whatsnewOverlay') closeWhatsnew();
  });
  function checkForUpdate() {
    let seen = null;
    try { seen = localStorage.getItem(SEEN_VERSION_KEY); } catch (e) {}
    if (seen === APP_VERSION) return;
    const isBrandNewUser = seen === null && items.length === 0;
    if (!isBrandNewUser) {
      const entries = CHANGELOG[APP_VERSION] || [];
      document.getElementById('whatsnewVersion').textContent = APP_VERSION;
      document.getElementById('whatsnewList').innerHTML = entries.map(text => `<li>${text}</li>`).join('');
      document.getElementById('whatsnewOverlay').classList.add('show');
    }
    try { localStorage.setItem(SEEN_VERSION_KEY, APP_VERSION); } catch (e) {}
  }

  // ---- Modal para editar item existente (nombre + categoría) ----
  function openEditModal(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    editingId = id;
    editingCategory = item.category || 'otros';
    const input = document.getElementById('editItemInput');
    input.value = item.text;
    renderEditGrid();
    document.getElementById('editModalOverlay').classList.add('show');
    setTimeout(() => input.focus(), 50);
  }

  function renderEditGrid() {
    const grid = document.getElementById('editModalGrid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'modal-cat-btn' + (cat.id === editingCategory ? ' selected' : '');
      btn.type = 'button';
      btn.dataset.action = 'select-edit-category';
      btn.dataset.catId = cat.id;
      btn.style.setProperty('--cat-color', catColorVar(cat));
      btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;
      grid.appendChild(btn);
    });
  }

  function closeEditModal() {
    document.getElementById('editModalOverlay').classList.remove('show');
    editingId = null;
    editingCategory = null;
  }

  function saveEdit() {
    if (!editingId) return;
    const item = items.find(i => i.id === editingId);
    if (!item) return;
    const newText = document.getElementById('editItemInput').value.trim();
    if (!newText) return;
    item.text = newText;
    item.category = editingCategory;
    save();
    render();
    closeEditModal();
  }

  document.getElementById('editModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'editModalOverlay') closeEditModal();
  });

  document.getElementById('editSaveBtn').addEventListener('click', saveEdit);

  document.getElementById('editItemInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveEdit();
    } else if (e.key === 'Escape') {
      closeEditModal();
    }
  });

  // ---- Autocompletado ----
  const KNOWN_PRODUCTS = Object.keys(PRODUCT_MAP).sort((a,b) => a.length - b.length);

  function getSuggestions(query) {
    const q = normalize(query);
    if (!q) return [];
    const starts = [];
    const contains = [];
    for (const p of KNOWN_PRODUCTS) {
      if (p === q) continue;
      if (p.startsWith(q)) starts.push(p);
      else if (p.includes(q)) contains.push(p);
      if (starts.length >= 6) break;
    }
    return [...starts, ...contains].slice(0, 6);
  }

  function renderSuggestions(query) {
    const box = document.getElementById('suggestions');
    const list = getSuggestions(query);
    currentSuggestions = list;
    highlightedIndex = -1;
    if (list.length === 0) {
      box.classList.remove('show');
      box.innerHTML = '';
      return;
    }
    box.innerHTML = list.map((p, idx) => {
      const cat = catById[PRODUCT_MAP[p]];
      const label = p.charAt(0).toUpperCase() + p.slice(1);
      return `<div class="suggestion-item" data-idx="${idx}">
        <span>${label}</span>
        <span class="suggestion-cat" style="--cat-color:${catColorVar(cat)}">${cat.icon} ${cat.name}</span>
      </div>`;
    }).join('');
    box.classList.add('show');

    box.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        selectSuggestion(idx);
      });
    });
  }

  function selectSuggestion(idx) {
    const p = currentSuggestions[idx];
    if (!p) return;
    const label = p.charAt(0).toUpperCase() + p.slice(1);
    addItem(label);
    const input = document.getElementById('newItem');
    input.value = '';
    hideSuggestions();
    input.focus();
  }

  function hideSuggestions() {
    document.getElementById('suggestions').classList.remove('show');
    currentSuggestions = [];
    highlightedIndex = -1;
  }

  // ---- Event listeners ----
  const input = document.getElementById('newItem');

  document.getElementById('addBtn').addEventListener('click', () => {
    addItem(input.value);
    input.value = '';
    hideSuggestions();
    input.focus();
  });

  input.addEventListener('input', (e) => {
    renderSuggestions(e.target.value);
  });

  input.addEventListener('keydown', (e) => {
    const box = document.getElementById('suggestions');
    const itemsEls = box.querySelectorAll('.suggestion-item');

    if (e.key === 'ArrowDown' && itemsEls.length) {
      e.preventDefault();
      highlightedIndex = Math.min(highlightedIndex + 1, itemsEls.length - 1);
      itemsEls.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
    } else if (e.key === 'ArrowUp' && itemsEls.length) {
      e.preventDefault();
      highlightedIndex = Math.max(highlightedIndex - 1, 0);
      itemsEls.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (highlightedIndex >= 0 && currentSuggestions[highlightedIndex]) {
        selectSuggestion(highlightedIndex);
      } else {
        addItem(e.target.value);
        e.target.value = '';
        hideSuggestions();
      }
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.add-row')) hideSuggestions();
  });

  document.getElementById('toggleChecked').addEventListener('click', () => {
    showChecked = !showChecked;
    save();
    render();
  });

  document.getElementById('clearChecked').addEventListener('click', clearChecked);

  // ---- Delegación de eventos (más robusto en Android/WebViews) ----
  // En vez de asignar listeners a cada item (que se recrean en cada render),
  // escuchamos una sola vez en los contenedores padre y miramos data-action.
  function handleDelegatedClick(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'toggle-collapse') {
      const catId = target.dataset.catId;
      collapsed[catId] = !collapsed[catId];
      save();
      const section = target.closest('.category-section');
      if (section) section.classList.toggle('collapsed');
    } else if (action === 'toggle-item') {
      toggleItem(target.dataset.id);
    } else if (action === 'delete-item') {
      deleteItem(target.dataset.id);
    } else if (action === 'edit-item') {
      openEditModal(target.dataset.id);
    } else if (action === 'pick-category') {
      addItemWithCategory(pendingText, target.dataset.catId);
      closeModal();
    } else if (action === 'select-edit-category') {
      editingCategory = target.dataset.catId;
      renderEditGrid();
    }
  }

  document.getElementById('main').addEventListener('click', handleDelegatedClick);
  document.getElementById('modalGrid').addEventListener('click', handleDelegatedClick);
  document.getElementById('editModalGrid').addEventListener('click', handleDelegatedClick);

  // Refuerzo táctil: algunos WebViews de Android disparan click con demora
  // o lo pierden en scroll rápido. touchend + click combinados sin duplicar.
  let lastTouchTime = 0;
  function handleDelegatedTouch(e) {
    lastTouchTime = Date.now();
  }
  document.getElementById('main').addEventListener('touchend', handleDelegatedTouch, { passive: true });

  // Init
  applyTheme();
  load();
  render();
  checkForUpdate();
})();

// Registro del Service Worker (habilita funcionamiento offline)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker registrado:', reg.scope))
      .catch((err) => console.log('Error registrando Service Worker:', err));
  });
}
</script>
